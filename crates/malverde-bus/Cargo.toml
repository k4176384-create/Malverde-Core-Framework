[package]
name = "malverde-bus"
version = "0.1.0"
edition = "2021"
description = "Internal event bus for Malverde Framework"

[dependencies]
malverde-core = { path = "../malverde-core" }
malverde-events = { path = "../malverde-events" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt"] }
log = { workspace = true }
thiserror = { workspace = true }
async-trait = "0.1"

[dev-dependencies]
mockall = { workspace = true }
