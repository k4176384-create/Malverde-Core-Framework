[package]
name = "malverde-cli"
version = "0.1.0"
edition = "2021"
authors = ["Malverde Team"]
description = "Command-line interface for the Malverde Framework"
license = "MIT"

[dependencies]
malverde-core = { path = "../malverde-core" }
malverde-bus = { path = "../malverde-bus" }
malverde-storage = { path = "../malverde-storage" }
malverde-events = { path = "../malverde-events" }
malverde-jobs = { path = "../malverde-jobs" }
malverde-config = { path = "../malverde-config" }
malverde-audit = { path = "../malverde-audit" }

clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.10"
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
